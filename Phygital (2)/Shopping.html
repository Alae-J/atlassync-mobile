<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phygital · Shopping flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Geist', -apple-system, system-ui, sans-serif; }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="screens/data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens/shop-bold.jsx"></script>

<script type="text/babel" data-presets="react">
const phoneW = 390;
const phoneH = 844;
const cardW = phoneW + 24;
const cardH = phoneH + 24;

const wrapPhone = (Inner, dark = false) => (
  <div style={{
    width: '100%', height: '100%',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    background: 'transparent',
  }}>
    <IOSDevice width={phoneW} height={phoneH}>
      <IOSStatusBar dark={dark} />
      <div style={{ position: 'absolute', inset: 0 }}>
        <Inner />
      </div>
    </IOSDevice>
  </div>
);

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="shop-bold"
        title="Shopping flow — bold/tactile"
        subtitle="Scan-as-you-go. From walking in, to camera-led shopping, to substitution prompts, to pay-and-walk-out. Tap a phone to open it fullscreen."
      >
        <DCArtboard id="arrive" label="1. Arrive — store detected" width={cardW} height={cardH} style={{ background: 'transparent', boxShadow: 'none', border: 'none' }}>
          {wrapPhone(ShopArrive)}
        </DCArtboard>
        <DCArtboard id="scan" label="2. Shopping — scan-as-you-go" width={cardW} height={cardH} style={{ background: 'transparent', boxShadow: 'none', border: 'none' }}>
          {wrapPhone(ShopScanning, true)}
        </DCArtboard>
        <DCArtboard id="sub" label="3. Substitution — out of stock" width={cardW} height={cardH} style={{ background: 'transparent', boxShadow: 'none', border: 'none' }}>
          {wrapPhone(ShopSubstitute, true)}
        </DCArtboard>
        <DCArtboard id="review" label="4. Review — checkout" width={cardW} height={cardH} style={{ background: 'transparent', boxShadow: 'none', border: 'none' }}>
          {wrapPhone(ShopReview)}
        </DCArtboard>
        <DCArtboard id="walkout" label="5. Walk out — done" width={cardW} height={cardH} style={{ background: 'transparent', boxShadow: 'none', border: 'none' }}>
          {wrapPhone(ShopWalkOut)}
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
